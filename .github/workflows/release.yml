name: release
on:
  release:
    types: [published]
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            goos: windows
            goarch: amd64
          - platform: macos
            goos: darwin
            goarch: amd64
          - platform: macos
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release asset
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${RELEASE_TAG##*/}"
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi
          asset="gh-tea-${version}-${GOOS}-${GOARCH}${extension}"
          mkdir -p dist
          go build -trimpath -o "dist/$asset" .

      - name: Upload release asset
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${RELEASE_TAG##*/}"
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi
          asset="gh-tea-${version}-${GOOS}-${GOARCH}${extension}"
          test -f "dist/$asset"
          gh release upload -- "$RELEASE_TAG" "dist/$asset"
